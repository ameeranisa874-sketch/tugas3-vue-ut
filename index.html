<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Aplikasi Pemesanan Bahan Ajar Universitas Terbuka</title>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <!-- Root Vue Application -->
    <div id="app">
        <!-- Header -->
        <header>
            <h1>SITTA</h1>
            <p>Sistem Pemesanan & Tracking Bahan Ajar Universitas Terbuka</p>
        </header>

        <!-- Loading State -->
        <div v-if="isLoading" class="alert alert-info text-center">
            Memuat data, mohon tunggu...
        </div>

        <!-- Error State -->
        <div v-if="apiError" class="alert alert-error">
            Terjadi kesalahan: {{ apiError }}
        </div>

        <!-- Tab Navigation -->
        <div v-if="!isLoading" class="tab-navigation">
            <button 
                class="tab-btn" 
                :class="{ active: isStokTabActive }"
                @click="switchTab('stok')">
                📦 Stok & CRUD
            </button>
            <button 
                class="tab-btn" 
                :class="{ active: isTrackingTabActive }"
                @click="switchTab('tracking')">
                📍 Tracking DO
            </button>
            <button 
                class="tab-btn" 
                :class="{ active: isOrderTabActive }"
                @click="switchTab('order')">
                ✍️ Formulir Pemesanan
            </button>
        </div>

        <!-- Tab Content -->
        <div v-if="!isLoading && apiData" class="tab-content">
            <!-- Stok & CRUD Tab -->
            <div v-show="isStokTabActive">
                <ba-stock-table :api-data="apiData"></ba-stock-table>
            </div>

            <!-- Tracking DO Tab -->
            <div v-show="isTrackingTabActive">
                <do-tracking :api-data="apiData"></do-tracking>
            </div>

            <!-- Order Form Tab -->
            <div v-show="isOrderTabActive">
                <order-form :api-data="apiData"></order-form>
            </div>
        </div>

        <!-- Modal Component -->
        <app-modal></app-modal>
    </div>

    <!-- =============================================
         TEMPLATES (Penempatan semua template komponen)
         ============================================= -->

    <!-- Template: Stock Table Component -->
    <template id="tpl-stock-table">
        <div class="ba-stock-table">
            <h2>Manajemen Stok Bahan Ajar</h2>
            
            <!-- Filter Section -->
            <div class="filter-section">
                <h3>Filter & Pencarian</h3>
                
                <div class="filter-row">
                    <div class="filter-group">
                        <label>UPBJJ (UT-Daerah):</label>
                        <select v-model="filterUpbjj">
                            <option value="">-- Semua UPBJJ --</option>
                            <option v-for="upbjj in upbjjOptions" :key="upbjj" :value="upbjj">
                                {{ upbjj }}
                            </option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Kategori Mata Kuliah:</label>
                        <select v-model="filterKategori" :disabled="!filterUpbjj">
                            <option value="">-- Semua Kategori --</option>
                            <option v-for="cat in filteredCategoryOptions" :key="cat" :value="cat">
                                {{ cat }}
                            </option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Cari (Kode/Judul/Lokasi):</label>
                        <input 
                            type="text" 
                            v-model="searchKeyword"
                            placeholder="Ketik untuk mencari...">
                    </div>
                </div>
                
                <div class="filter-actions">
                    <button class="btn btn-secondary" @click="resetFilter">🔄 Reset Filter</button>
                </div>
            </div>
            
            <!-- Add Button -->
            <div class="mt-20">
                <button class="btn btn-success" @click="showAddForm">➕ Tambah Data Baru</button>
            </div>
            
            <!-- Form Add/Edit (Modal-like) -->
            <div v-if="isFormVisible" class="modal-overlay" @click.self="isFormVisible = false">
                <div class="modal">
                    <h2>{{ formMode === 'add' ? 'Tambah Data Stok' : 'Edit Data Stok' }}</h2>
                    
                    <div class="form-group">
                        <label>Kode Bahan Ajar:</label>
                        <input 
                            type="text" 
                            v-model="formData.kode"
                            @keypress="handleFormKeypress"
                            placeholder="Contoh: EKMA4116">
                    </div>
                    
                    <div class="form-group">
                        <label>Judul:</label>
                        <input 
                            type="text" 
                            v-model="formData.judul"
                            @keypress="handleFormKeypress"
                            placeholder="Judul bahan ajar">
                    </div>
                    
                    <div class="form-group">
                        <label>Kategori:</label>
                        <select v-model="formData.kategori">
                            <option value="">-- Pilih Kategori --</option>
                            <option v-for="cat in categoryOptions" :key="cat" :value="cat">
                                {{ cat }}
                            </option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>UPBJJ:</label>
                        <select v-model="formData.upbjj">
                            <option value="">-- Pilih UPBJJ --</option>
                            <option v-for="upbjj in upbjjOptions" :key="upbjj" :value="upbjj">
                                {{ upbjj }}
                            </option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Lokasi Rak:</label>
                        <input 
                            type="text" 
                            v-model="formData.lokasiRak"
                            @keypress="handleFormKeypress"
                            placeholder="Contoh: R1-A3">
                    </div>
                    
                    <div class="form-group">
                        <label>Harga (Rp):</label>
                        <input 
                            type="number" 
                            v-model.number="formData.harga"
                            @keypress="handleFormKeypress"
                            placeholder="0">
                    </div>
                    
                    <div class="form-group">
                        <label>Qty (Stok):</label>
                        <input 
                            type="number" 
                            v-model.number="formData.qty"
                            @keypress="handleFormKeypress"
                            placeholder="0">
                    </div>
                    
                    <div class="form-group">
                        <label>Safety Stock:</label>
                        <input 
                            type="number" 
                            v-model.number="formData.safety"
                            @keypress="handleFormKeypress"
                            placeholder="0">
                    </div>
                    
                    <div class="form-group">
                        <label>Catatan (HTML):</label>
                        <textarea 
                            v-model="formData.catatanHTML"
                            @keypress="handleFormKeypress"
                            placeholder="Contoh: <em>Edisi 2024</em>"
                            rows="3"></textarea>
                    </div>
                    
                    <div class="modal-footer">
                        <button class="btn btn-secondary" @click="isFormVisible = false">Batal</button>
                        <button class="btn btn-primary" @click="saveData">Simpan</button>
                    </div>
                </div>
            </div>
            
            <!-- Table -->
            <table v-if="filteredData.length > 0" class="mt-20">
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Judul</th>
                        <th>Kategori</th>
                        <th>UPBJJ</th>
                        <th>Lokasi Rak</th>
                        <th>Harga</th>
                        <th>Qty</th>
                        <th>Safety</th>
                        <th>Status</th>
                        <th>Catatan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in filteredData" :key="index">
                        <td>{{ item.kode }}</td>
                        <td>{{ item.judul }}</td>
                        <td>{{ item.kategori }}</td>
                        <td>{{ item.upbjj }}</td>
                        <td>{{ item.lokasiRak }}</td>
                        <td>{{ item.harga | currency }}</td>
                        <td>{{ item.qty | unit }}</td>
                        <td>{{ item.safety | unit }}</td>
                        <td>
                            <status-badge :qty="item.qty" :safety="item.safety" :catatan="item.catatanHTML"></status-badge>
                        </td>
                        <td>
                            <div v-html="item.catatanHTML" class="catatan-preview"></div>
                        </td>
                        <td>
                            <button class="btn btn-primary" @click="showEditForm(index)" title="Edit">✏️</button>
                            <button class="btn btn-danger" @click="confirmDelete(index)" title="Hapus">🗑️</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Empty State -->
            <div v-else class="alert alert-info text-center mt-20">
                Tidak ada data yang sesuai dengan filter yang dipilih.
            </div>
        </div>
    </template>

    <!-- Template: DO Tracking Component -->
    <template id="tpl-do-tracking">
        <div class="do-tracking">
            <h2>Tracking Delivery Order (DO)</h2>
            <p>Halaman untuk mencari dan melacak status pengiriman DO bahan ajar.</p>
            <!-- Implementasi lengkap di file do-tracking.js -->
        </div>
    </template>

    <!-- Template: Order Form Component -->
    <template id="tpl-order-form">
        <div class="order-form">
            <h2>Formulir Pemesanan Baru</h2>
            <p>Halaman untuk membuat pemesanan bahan ajar baru.</p>
            <!-- Implementasi lengkap di file order-form.js -->
        </div>
    </template>

    <!-- Template: Status Badge Component -->
    <template id="tpl-status-badge">
        <div class="status-badge-wrapper">
            <span 
                :class="badgeClass"
                @mouseenter="toggleTooltip"
                @mouseleave="hideTooltip"
                :title="tooltipText">
                {{ statusText }}
            </span>
            <!-- Tooltip catatan HTML -->
            <div v-if="showTooltip && catatan" class="catatan-tooltip">
                <div v-html="catatan"></div>
            </div>
        </div>
    </template>

    <!-- Template: Modal Component -->
    <template id="tpl-app-modal">
        <div v-if="isOpen" class="modal-overlay" @click.self="close">
            <div class="modal">
                <h2>{{ title }}</h2>
                <p>{{ message }}</p>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="close">Batal</button>
                    <button class="btn btn-danger" @click="confirm">{{ confirmText }}</button>
                </div>
            </div>
        </div>
    </template>

    <!-- =============================================
         SCRIPT TAGS (Urutan penting sesuai spesifikasi)
         ============================================= -->

    <!-- 1. Vue.js v2 dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

    <!-- 2. Service Layer (API & Data) -->
    <script src="./js/services/api.js"></script>

    <!-- 3. Vue Components (Custom Elements) -->
    <script src="./js/components/status-badge.js"></script>
    <script src="./js/components/app-modal.js"></script>
    <script src="./js/components/stock-table.js"></script>
    <script src="./js/components/do-tracking.js"></script>
    <script src="./js/components/order-form.js"></script>

    <!-- 4. Root Vue Instance (App State & Coordination) -->
    <script src="./js/app.js"></script>
</body>
</html>
