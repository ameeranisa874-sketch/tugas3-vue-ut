<!-- Template: DO Tracking Component -->
<template id="tpl-do-tracking">
    <div class="do-tracking">
        <h2>Tracking Delivery Order (DO)</h2>
        
        <!-- Search Section -->
        <div class="filter-section">
            <h3>Cari DO</h3>
            
            <div class="filter-row">
                <div class="filter-group">
                    <label>Cari Berdasarkan:</label>
                    <select v-model="searchType">
                        <option value="doNumber">Nomor DO</option>
                        <option value="nim">NIM Mahasiswa</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Masukkan {{ searchType === 'doNumber' ? 'Nomor DO' : 'NIM' }}:</label>
                    <input 
                        type="text" 
                        v-model="searchQuery"
                        @keypress.enter="performSearch"
                        :placeholder="searchPlaceholder">
                </div>
            </div>
            
            <div class="filter-actions">
                <button class="btn btn-primary" @click="performSearch">🔍 Cari</button>
                <button class="btn btn-secondary" @click="resetSearch">🔄 Reset</button>
                <button class="btn btn-success" @click="showAddForm">➕ Buat DO Baru</button>
            </div>
        </div>
        
        <!-- Search Result -->
        <div v-if="hasSearched && foundTracking" class="mt-20">
            <div class="alert alert-success">
                ✅ Data ditemukan untuk {{ searchType === 'doNumber' ? 'DO' : 'NIM' }}: {{ searchQuery }}
            </div>
            
            <div class="tracking-detail">
                <h3>Detail DO: {{ foundTracking.doNumber }}</h3>
                
                <div class="detail-info">
                    <div class="info-row">
                        <span class="info-label">Nama Penerima:</span>
                        <span class="info-value">{{ foundTracking.data.nama }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">NIM:</span>
                        <span class="info-value">{{ foundTracking.data.nim }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value" :class="'status-' + foundTracking.data.status.toLowerCase()">
                            {{ foundTracking.data.status }}
                        </span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Ekspedisi:</span>
                        <span class="info-value">{{ foundTracking.data.ekspedisi }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Tanggal Kirim:</span>
                        <span class="info-value">{{ foundTracking.data.tanggalKirim | formatDate }}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Total:</span>
                        <span class="info-value">{{ foundTracking.data.total | currency }}</span>
                    </div>
                </div>
                
                <!-- Timeline Perjalanan -->
                <div class="timeline">
                    <h4>Timeline Perjalanan:</h4>
                    <div v-if="foundTracking.data.perjalanan && foundTracking.data.perjalanan.length" class="timeline-items">
                        <div v-for="(event, idx) in foundTracking.data.perjalanan" :key="idx" class="timeline-item">
                            <div class="timeline-marker">📍</div>
                            <div class="timeline-content">
                                <div class="timeline-time">{{ event.waktu }}</div>
                                <div class="timeline-text">{{ event.keterangan }}</div>
                            </div>
                        </div>
                    </div>
                    <div v-else class="alert alert-info">
                        Belum ada update perjalanan
                    </div>
                </div>
            </div>
        </div>
        
        <!-- No Result -->
        <div v-else-if="hasSearched && !foundTracking" class="alert alert-error mt-20">
            ❌ Data tidak ditemukan untuk {{ searchType === 'doNumber' ? 'DO' : 'NIM' }}: {{ searchQuery }}
        </div>
        
        <!-- Add DO Form -->
        <div v-if="isAddFormVisible" class="modal-overlay" @click.self="isAddFormVisible = false">
            <div class="modal">
                <h2>Buat Delivery Order Baru</h2>
                
                <div class="form-group">
                    <label>NIM Mahasiswa:</label>
                    <input 
                        type="text" 
                        v-model="newDoData.nim"
                        placeholder="Contoh: 123456789">
                </div>
                
                <div class="form-group">
                    <label>Nama Penerima:</label>
                    <input 
                        type="text" 
                        v-model="newDoData.nama"
                        placeholder="Nama lengkap mahasiswa">
                </div>
                
                <div class="form-group">
                    <label>Status:</label>
                    <select v-model="newDoData.status">
                        <option>Pending</option>
                        <option>Dalam Perjalanan</option>
                        <option>Diterima</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Ekspedisi:</label>
                    <select v-model="newDoData.ekspedisi">
                        <option>JNE</option>
                        <option>Tiki</option>
                        <option>Pos Indonesia</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Tanggal Kirim:</label>
                    <input 
                        type="date" 
                        v-model="newDoData.tanggalKirim">
                </div>
                
                <div class="form-group">
                    <label>Paket:</label>
                    <input 
                        type="text" 
                        v-model="newDoData.paket"
                        placeholder="Kode paket, contoh: PAKET-UT-001">
                </div>
                
                <div class="form-group">
                    <label>Total (Rp):</label>
                    <input 
                        type="number" 
                        v-model.number="newDoData.total"
                        placeholder="0">
                </div>
                
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="isAddFormVisible = false">Batal</button>
                    <button class="btn btn-success" @click="addDo">Buat DO</button>
                </div>
            </div>
        </div>
    </div>
</template>
