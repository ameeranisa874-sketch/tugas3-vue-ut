<!-- Template: Order Form Component -->
<template id="tpl-order-form">
    <div class="order-form">
        <h2>Formulir Pemesanan Bahan Ajar</h2>
        
        <!-- Success Message -->
        <div v-if="isSubmitted" class="alert alert-success">
            ✅ Pesanan berhasil diajukan! 
            <br><strong>Nomor Referensi:</strong> {{ submittedData.tanggalPesan }}
            <br>Form akan direset dalam beberapa detik...
        </div>
        
        <!-- Form -->
        <form v-if="!isSubmitted" @submit.prevent="submitForm" class="order-form-section">
            <div class="form-row">
                <div class="form-group">
                    <label>NIM (9 digit):</label>
                    <input 
                        type="text" 
                        v-model="form.nim"
                        placeholder="Contoh: 123456789"
                        maxlength="9">
                    <small v-if="form.nim && !validateNim(form.nim)" class="text-danger">
                        ⚠️ NIM harus berupa 9 digit angka
                    </small>
                </div>
                
                <div class="form-group">
                    <label>Nama Lengkap:</label>
                    <input 
                        type="text" 
                        v-model="form.nama"
                        placeholder="Nama lengkap sesuai KTP">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>UPBJJ (UT-Daerah):</label>
                    <select v-model="form.upbjj">
                        <option value="">-- Pilih UPBJJ --</option>
                        <option v-for="upbjj in upbjjOptions" :key="upbjj" :value="upbjj">
                            {{ upbjj }}
                        </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Paket Bahan Ajar:</label>
                    <select v-model="form.paket">
                        <option value="">-- Pilih Paket --</option>
                        <option v-for="pkg in paketOptions" :key="pkg.kode" :value="pkg.kode">
                            {{ pkg.nama }} ({{ pkg.harga | currency }})
                        </option>
                    </select>
                </div>
            </div>
            
            <!-- Paket Detail -->
            <div v-if="selectedPaketDetail" class="paket-detail alert alert-info">
                <h4>{{ selectedPaketDetail.nama }}</h4>
                <p><strong>Isi Paket:</strong> {{ selectedPaketDetail.isi.join(', ') }}</p>
                <p><strong>Harga per Unit:</strong> {{ selectedPaketDetail.harga | currency }}</p>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Jumlah Paket:</label>
                    <input 
                        type="number" 
                        v-model.number="form.qty"
                        min="1"
                        placeholder="1">
                </div>
                
                <div class="form-group">
                    <label>Total Harga:</label>
                    <input 
                        type="text" 
                        :value="totalPrice | currency"
                        disabled
                        class="readonly">
                </div>
            </div>
            
            <div class="form-group">
                <label>Catatan / Permintaan Khusus (Opsional):</label>
                <textarea 
                    v-model="form.notes"
                    placeholder="Contoh: Mohon pengiriman ke alamat rumah"
                    rows="4"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" :disabled="!isFormValid">
                    ✅ Ajukan Pesanan
                </button>
                <button type="button" class="btn btn-secondary" @click="resetForm">
                    🔄 Reset Form
                </button>
            </div>
        </form>
        
        <!-- Summary Pesanan -->
        <div v-if="submittedData" class="order-summary">
            <h3>Ringkasan Pesanan:</h3>
            <div class="summary-info">
                <div class="info-row">
                    <span class="info-label">NIM:</span>
                    <span class="info-value">{{ submittedData.nim }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Nama:</span>
                    <span class="info-value">{{ submittedData.nama }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">UPBJJ:</span>
                    <span class="info-value">{{ submittedData.upbjj }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Paket:</span>
                    <span class="info-value">{{ submittedData.paketNama }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Jumlah:</span>
                    <span class="info-value">{{ submittedData.qty }}</span>
                </div>
                <div class="info-row" style="font-weight: bold;">
                    <span class="info-label">Total:</span>
                    <span class="info-value">{{ submittedData.totalPrice | currency }}</span>
                </div>
            </div>
        </div>
    </div>
</template>
